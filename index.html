<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="Style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <section class="container">
    <div class="card">
      <div class="upper-card">
        <div class="card-img"><img src="./assets/images/avatar-jessica.jpeg" alt="Woman profile picture"></div>
        <div class="card-h1">
          <h1>Jessica Randall<h1></h1>
        </div>
        <div class="card-h3">
          <h3> London, United Kingdom</h3>
        </div>
        <div class="card-p">
          <p>
            "Front-end developer and avid reader."
          </p>
        </div>




      </div>

      <div class="lower-card">
        <a href="https://github.com/" class="link"> GitHub</a>
        <a href="https://x.com/" class="link"> Twitter</a>
        <a href="https://www.frontendmentor.io/home" class="link"> Frontend Mentor</a>
        <a href="https://www.linkedin.com/" class="link"> LinkedIn</a>
        <a href="https://www.instagram.com/" class="link"> Instagram</a>
      </div>
    </div>
  </section>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Samuel Inyang</a>.
  </footer>
</body>

</html>
